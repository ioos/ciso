name: Wheels

on:
  pull_request:
  push:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_bdist:
    name: "Build ${{ matrix.os }} (${{ matrix.cibw_platform }}-${{ matrix.arch }}) wheels"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            arch: x86_64
            cibw_platform: linux
          - name: Pyodide
            os: ubuntu-22.04
            arch: auto
            cibw_platform: pyodide
          - name: Linux-arm
            os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: linux
          - name: Windows
            os: windows-2022
            arch: AMD64
            cibw_platform: windows
          - name: macOS-arm
            os: macos-15
            arch: arm64
            cibw_platform: macos
          - name: macOS-intel
            os: macos-15-intel
            arch: x86_64
            cibw_platform: macos

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: "Building ${{ matrix.os }} (${{ matrix.arch }}) wheels"
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae  # v4.2.1
      env:
        CIBW_SKIP: "pp* *-musllinux*"
        CIBW_BUILD: "cp311-* cp314-*"
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_PLATFORM: ${{ matrix.cibw_platform }}
        CIBW_BUILD_FRONTEND: build
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_TEST_REQUIRES: abi3audit pytest
        CIBW_TEST_COMMAND: >
          python -c "import ciso; print(f'ciso v{ciso.__version__}')" &&
          python -m pytest --pyargs ciso

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: pypi-artifacts-${{ matrix.os }}-${{ matrix.arch }}
        path: ${{ github.workspace }}/wheelhouse/*.whl
    permissions:
      actions: write

  show-artifacts:
    needs: [ build_bdist ]
    name: "Show artifacts"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: pypi-artifacts*
        path: ${{ github.workspace }}/dist
        merge-multiple: true

  publish-artifacts-pypi:
    needs: [ build_bdist ]
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'release'
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: pypi-artifacts*
        path: ${{ github.workspace }}/dist
        merge-multiple: true

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
    environment:
      name: pypi
      url: https://pypi.org/p/ciso/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
